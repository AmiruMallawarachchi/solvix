spring.datasource.url=jdbc:h2:mem:solvix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

solvix.security.users.customer.username=test-customer
solvix.security.users.customer.password=test-customer-password
solvix.security.users.support.username=test-support
solvix.security.users.support.password=test-support-password
