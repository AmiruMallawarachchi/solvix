spring.datasource.url=jdbc:h2:mem:solvix;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

solvix.security.jwt.secret=test-jwt-secret-with-at-least-32-characters
solvix.security.jwt.expiration-seconds=900
solvix.security.bootstrap.customer.username=test-customer
solvix.security.bootstrap.customer.password=test-customer-password
solvix.security.bootstrap.support.username=test-support
solvix.security.bootstrap.support.password=test-support-password
