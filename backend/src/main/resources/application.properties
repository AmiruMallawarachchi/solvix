spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/solvix}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:solvix}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:solvix}}
spring.datasource.driver-class-name=org.postgresql.Driver

server.port=${PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
solvix.security.cors.allowed-origin=${SOLVIX_CORS_ALLOWED_ORIGIN:http://localhost:3000}

solvix.security.jwt.secret=${SOLVIX_JWT_SECRET}
solvix.security.jwt.expiration-seconds=900
solvix.security.bootstrap.customer.username=${SOLVIX_CUSTOMER_USERNAME}
solvix.security.bootstrap.customer.password=${SOLVIX_CUSTOMER_PASSWORD}
solvix.security.bootstrap.support.username=${SOLVIX_SUPPORT_USERNAME}
solvix.security.bootstrap.support.password=${SOLVIX_SUPPORT_PASSWORD}
